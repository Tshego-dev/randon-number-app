<!DOCTYPE html>
<html>

<head>

    <title>Random Number Generator</title>

    <style>

        body{
            font-family: Arial;
            background: #f4f4f4;
            padding: 40px;
        }

        .container{
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 500px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align: center;
            color: #333;
        }

        .set{
            padding: 12px;
            margin: 10px 0;
            background: #eeeeee;
            border-radius: 5px;
            font-size: 18px;
        }

        .buttons{
            display: flex;
            gap: 10px;
        }

        button{
            flex: 1;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
        }

        .generate{
            background: #007bff;
        }

        .generate:hover{
            background: #0056b3;
        }

        .cancel{
            background: #dc3545;
        }

        .cancel:hover{
            background: #a71d2a;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Random Numbers Generator</h1>

        <div class="buttons">

            <!-- Generate Button -->
            <form method="POST" style="flex:1;">

                <button type="submit" class="generate">
                    Generate Numbers
                </button>

            </form>

            <!-- Cancel Button -->
            <form method="GET" style="flex:1;">

                <button type="submit" class="cancel">
                    Cancel
                </button>

            </form>

        </div>

        <br>

        {% if sets %}

            {% for set in sets %}

                <div class="set">

                    <strong>Set {{ loop.index }} :</strong>

                    {% for num in set %}
                        {{ num }}
                    {% endfor %}

                </div>

            {% endfor %}

        {% endif %}

    </div>

</body>

</html>
